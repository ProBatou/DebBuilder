name: GitHub Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check official Debian asset
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      deb_name: ${{ steps.release_result.outputs.deb_name }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PUSH_TAG: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_EVENT_NAME" == "push" ]]; then
            tag="$RELEASE_PUSH_TAG"
          else
            tag="$RELEASE_INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z.+~_-]*$ ]]; then
            echo "Release tag must be v followed by a Debian-compatible version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged checkout
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          V1_RELEASE_COMMIT: af22d06a59a8ab83f99faee16ea31da4dd49fbbe
        run: |
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT_NAME" == "push" ]]; then
            event_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
            if [[ "$tag_commit" != "$event_commit" ]]; then
              echo "Checked-out tag does not match the triggering commit" >&2
              exit 1
            fi
          fi
          if [[ "$RELEASE_TAG" == "v1.0.0" && "$tag_commit" != "$V1_RELEASE_COMMIT" ]]; then
            echo "v1.0.0 must remain fixed at $V1_RELEASE_COMMIT" >&2
            exit 1
          fi
          echo "Verified $RELEASE_TAG checkout at $tag_commit"

      - name: Verify tag, application version, and canonical Recipe
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os

          from debbuilder.release_build import release_plan

          plan = release_plan(os.environ["RELEASE_TAG"])
          print(
              f"{plan['tag']} -> {plan['filename']} "
              f"(built-in definition {plan['definition_version']})"
          )
          PY

      - name: Verify packaging tools
        run: dpkg-deb --version

      - name: Verify qualified Validation image inputs and descriptors
        run: |
          python3 -m tests.release_validation_inputs \
            --repository-root "$GITHUB_WORKSPACE" \
            --lock "$GITHUB_WORKSPACE/validation/validation_images.lock.json" \
            --manifest "$GITHUB_WORKSPACE/debbuilder/validation_images.json"

      - name: Run release and packaging tests
        run: |
          python3 -m py_compile server.py debbuilder/*.py
          python3 -m unittest -v \
            tests.test_builtin_recipe \
            tests.test_debian_packaging \
            tests.test_release_build \
            tests.test_release_validation_inputs \
            tests.test_runtime_storage \
            tests.test_source_acquisition \
            tests.test_systemd_unit

      - name: Install OCI verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Diagnose anonymous OCI access and select release mode
        id: oci_release_mode
        shell: bash
        env:
          BOOKWORM_DESCRIPTOR: ghcr.io/probatou/debbuilder-validation-bookworm@sha256:871edf6fb764805c7e149a600080adb66e692952a1655ef1fb2ca883b9c6f1a7
        run: |
          set -euo pipefail
          probe_root="$(mktemp -d)"
          cleanup() {
            sudo chown -R "$(id -u):$(id -g)" "$probe_root" >/dev/null 2>&1 || true
            rm -rf -- "$probe_root"
          }
          trap cleanup EXIT

          bounded_stderr() {
            local label="$1"
            local path="$2"
            echo "$label stderr (last 12000 bytes):"
            if [[ -s "$path" ]]; then
              tail -c 12000 "$path"
              echo
            else
              echo "<empty>"
            fi
          }

          echo "podman version: $(podman --version)"
          mkdir -p "$probe_root/rootless-root" "$probe_root/rootless-run"
          printf '{}\n' > "$probe_root/rootless-auth.json"
          chmod 600 "$probe_root/rootless-auth.json"
          set +e
          rootless_info="$(podman \
            --root "$probe_root/rootless-root" \
            --runroot "$probe_root/rootless-run" \
            info --format 'rootless={{.Host.Security.Rootless}} storage_driver={{.Store.GraphDriverName}}' 2>&1)"
          rootless_info_status=$?
          set -e
          echo "rootless mode: info_exit=$rootless_info_status $rootless_info"
          set +e
          podman \
            --root "$probe_root/rootless-root" \
            --runroot "$probe_root/rootless-run" \
            pull --quiet \
            --authfile "$probe_root/rootless-auth.json" \
            "$BOOKWORM_DESCRIPTOR" \
            > "$probe_root/rootless.stdout" \
            2> "$probe_root/rootless.stderr"
          rootless_status=$?
          set -e
          echo "rootless exact pull exit status: $rootless_status"
          if [[ "$rootless_status" -eq 0 ]]; then
            bounded_stderr "rootless" "$probe_root/rootless.stderr"
            echo "selected release mode: rootless"
            echo "mode=rootless" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bounded_stderr "rootless" "$probe_root/rootless.stderr"

          mkdir -p "$probe_root/rootful-root" "$probe_root/rootful-run"
          printf '{}\n' > "$probe_root/rootful-auth.json"
          chmod 600 "$probe_root/rootful-auth.json"
          set +e
          rootful_info="$(sudo podman \
            --root "$probe_root/rootful-root" \
            --runroot "$probe_root/rootful-run" \
            info --format 'rootless={{.Host.Security.Rootless}} storage_driver={{.Store.GraphDriverName}}' 2>&1)"
          rootful_info_status=$?
          set -e
          echo "rootful mode: info_exit=$rootful_info_status $rootful_info"
          set +e
          sudo podman \
            --root "$probe_root/rootful-root" \
            --runroot "$probe_root/rootful-run" \
            pull --quiet \
            --authfile "$probe_root/rootful-auth.json" \
            "$BOOKWORM_DESCRIPTOR" \
            > "$probe_root/rootful.stdout" \
            2> "$probe_root/rootful.stderr"
          rootful_status=$?
          set -e
          echo "rootful exact pull exit status: $rootful_status"
          bounded_stderr "rootful" "$probe_root/rootful.stderr"
          if [[ "$rootful_status" -ne 0 ]]; then
            echo "Both anonymous exact-digest probes failed; refusing the release build" >&2
            exit 1
          fi
          echo "selected release mode: rootful"
          echo "mode=rootful" >> "$GITHUB_OUTPUT"

      - name: Anonymously verify accepted descriptors and build official assets
        id: release_result
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          RELEASE_MODE: ${{ steps.oci_release_mode.outputs.mode }}
        run: |
          release_command=(
            python3 -m debbuilder.release_build
            --tag "$RELEASE_TAG"
            --source-root "$GITHUB_WORKSPACE"
            --validation-images "$GITHUB_WORKSPACE/debbuilder/validation_images.json"
            --output-dir "$GITHUB_WORKSPACE/release-assets"
          )
          if [[ "$RELEASE_MODE" == "rootful" ]]; then
            sudo -E "${release_command[@]}" > release-build.json
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/release-assets"
          elif [[ "$RELEASE_MODE" == "rootless" ]]; then
            "${release_command[@]}" > release-build.json
          else
            echo "Unknown release mode: $RELEASE_MODE" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          python3 - <<'PY'
          import json
          import os
          import re

          with open("release-build.json", encoding="utf-8") as handle:
              name = json.load(handle)["artifact"]["name"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9+.-]*_[0-9A-Za-z.+~_-]+_[a-z0-9]+\.deb", name):
              raise SystemExit("release helper returned an unsafe artifact name")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"deb_name={name}\n")
          PY

      - name: Preserve checked assets for Release creation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debbuilder-release-${{ steps.release_tag.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download checked assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debbuilder-release-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Recheck downloaded assets
        shell: bash
        env:
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          test -f "release-assets/$DEB_NAME"
          test -f release-assets/SHA256SUMS
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )

      - name: Create draft, verify assets, and publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          gh release create "$TAG" \
            "release-assets/$DEB_NAME" \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DebBuilder $TAG" \
            --generate-notes \
            --draft
          printf '%s\n' "$DEB_NAME" SHA256SUMS | sort > expected-assets.txt
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > uploaded-assets.txt
          diff --unified expected-assets.txt uploaded-assets.txt
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
