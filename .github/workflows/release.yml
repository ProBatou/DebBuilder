name: GitHub Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check official Debian asset
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      deb_name: ${{ steps.release_result.outputs.deb_name }}

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PUSH_TAG: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_EVENT_NAME" == "push" ]]; then
            tag="$RELEASE_PUSH_TAG"
          else
            tag="$RELEASE_INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9][0-9A-Za-z.+~_-]*$ ]]; then
            echo "Release tag must be v followed by a Debian-compatible version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged checkout
        shell: bash
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          V1_RELEASE_COMMIT: af22d06a59a8ab83f99faee16ea31da4dd49fbbe
        run: |
          tag_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit does not match $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT_NAME" == "push" ]]; then
            event_commit="$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
            if [[ "$tag_commit" != "$event_commit" ]]; then
              echo "Checked-out tag does not match the triggering commit" >&2
              exit 1
            fi
          fi
          if [[ "$RELEASE_TAG" == "v1.0.0" && "$tag_commit" != "$V1_RELEASE_COMMIT" ]]; then
            echo "v1.0.0 must remain fixed at $V1_RELEASE_COMMIT" >&2
            exit 1
          fi
          echo "Verified $RELEASE_TAG checkout at $tag_commit"

      - name: Verify tag, application version, and canonical Recipe
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os

          from debbuilder.release_build import release_plan

          plan = release_plan(os.environ["RELEASE_TAG"])
          print(
              f"{plan['tag']} -> {plan['filename']} "
              f"(built-in definition {plan['definition_version']})"
          )
          PY

      - name: Verify packaging tools
        run: dpkg-deb --version

      - name: Verify qualified Validation image inputs and descriptors
        run: |
          python3 -m tests.release_validation_inputs \
            --repository-root "$GITHUB_WORKSPACE" \
            --lock "$GITHUB_WORKSPACE/validation/validation_images.lock.json" \
            --manifest "$GITHUB_WORKSPACE/debbuilder/validation_images.json"

      - name: Run release and packaging tests
        run: |
          python3 -m py_compile server.py debbuilder/*.py
          python3 -m unittest -v \
            tests.test_builtin_recipe \
            tests.test_debian_packaging \
            tests.test_release_build \
            tests.test_release_validation_inputs \
            tests.test_runtime_storage \
            tests.test_source_acquisition \
            tests.test_systemd_unit

      - name: Install OCI verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Anonymously verify accepted descriptors and build official assets
        id: release_result
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          STORAGE_DRIVER: vfs
          PODMAN_SHORT_ROOT: /tmp/dbb-root-${{ github.run_id }}-${{ github.run_attempt }}
          PODMAN_SHORT_RUNROOT: /tmp/dbb-run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          wrapper_dir="$RUNNER_TEMP/debbuilder-podman-wrapper"
          podman_diag_log="$RUNNER_TEMP/debbuilder-podman.stderr.log"
          if [[ ! "$PODMAN_SHORT_ROOT" =~ ^/tmp/dbb-root-[0-9]+-[0-9]+$ ]]; then
            echo "invalid workflow-owned Podman root: $PODMAN_SHORT_ROOT" >&2
            exit 1
          fi
          if [[ ! "$PODMAN_SHORT_RUNROOT" =~ ^/tmp/dbb-run-[0-9]+-[0-9]+$ ]]; then
            echo "invalid workflow-owned Podman runroot: $PODMAN_SHORT_RUNROOT" >&2
            exit 1
          fi
          if ((${#PODMAN_SHORT_ROOT} >= 50)); then
            echo "workflow-owned Podman root is not shorter than 50 characters: $PODMAN_SHORT_ROOT" >&2
            exit 1
          fi
          if ((${#PODMAN_SHORT_RUNROOT} >= 50)); then
            echo "workflow-owned Podman runroot is not shorter than 50 characters: $PODMAN_SHORT_RUNROOT" >&2
            exit 1
          fi
          mkdir -p -- "$wrapper_dir"
          mkdir -p -- "$PODMAN_SHORT_ROOT" "$PODMAN_SHORT_RUNROOT"
          echo "workflow-owned Podman root prepared: $PODMAN_SHORT_ROOT (length ${#PODMAN_SHORT_ROOT})"
          echo "workflow-owned Podman runroot prepared: $PODMAN_SHORT_RUNROOT (length ${#PODMAN_SHORT_RUNROOT})"
          cat > "$wrapper_dir/podman" <<'PODMAN_WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail

          : "${PODMAN_DIAG_LOG:?PODMAN_DIAG_LOG must be set}"
          : "${PODMAN_SHORT_ROOT:?PODMAN_SHORT_ROOT must be set}"
          : "${PODMAN_SHORT_RUNROOT:?PODMAN_SHORT_RUNROOT must be set}"
          root=""
          runroot=""
          args=("$@")

          log_diag() {
            printf '%s\n' "$*" | tee -a "$PODMAN_DIAG_LOG" >&2
          }

          for ((index = 0; index < ${#args[@]}; index++)); do
            case "${args[$index]}" in
              --root)
                if ((index + 1 >= ${#args[@]})); then
                  echo "podman wrapper: --root requires a path" >&2
                  exit 125
                fi
                root="${args[$((index + 1))]}"
                args[$((index + 1))]="$PODMAN_SHORT_ROOT"
                ;;
              --root=*)
                root="${args[$index]#--root=}"
                args[$index]="--root=$PODMAN_SHORT_ROOT"
                ;;
              --runroot)
                if ((index + 1 >= ${#args[@]})); then
                  echo "podman wrapper: --runroot requires a path" >&2
                  exit 125
                fi
                runroot="${args[$((index + 1))]}"
                args[$((index + 1))]="$PODMAN_SHORT_RUNROOT"
                ;;
              --runroot=*)
                runroot="${args[$index]#--runroot=}"
                args[$index]="--runroot=$PODMAN_SHORT_RUNROOT"
                ;;
            esac
          done

          if [[ -n "$root" ]]; then
            mkdir -p -- "$PODMAN_SHORT_ROOT"
            log_diag "podman wrapper: canonical root requested: $root (length ${#root})"
            log_diag "podman wrapper: mapped root: $PODMAN_SHORT_ROOT (length ${#PODMAN_SHORT_ROOT})"
          fi
          if [[ -n "$runroot" ]]; then
            mkdir -p -- "$PODMAN_SHORT_RUNROOT"
            log_diag "podman wrapper: canonical runroot requested: $runroot (length ${#runroot})"
            log_diag "podman wrapper: mapped runroot: $PODMAN_SHORT_RUNROOT (length ${#PODMAN_SHORT_RUNROOT})"
          fi
          log_diag "podman wrapper: invoking /usr/bin/podman with storage driver ${STORAGE_DRIVER:-<unset>}"
          exec /usr/bin/podman "${args[@]}" \
            2> >(tee -a "$PODMAN_DIAG_LOG" >&2)
          PODMAN_WRAPPER
          chmod 700 "$wrapper_dir/podman"
          : > "$podman_diag_log"

          set +e
          PATH="$wrapper_dir:$PATH" PODMAN_DIAG_LOG="$podman_diag_log" \
          python3 -m debbuilder.release_build \
            --tag "$RELEASE_TAG" \
            --source-root "$GITHUB_WORKSPACE" \
            --validation-images "$GITHUB_WORKSPACE/debbuilder/validation_images.json" \
            --output-dir "$GITHUB_WORKSPACE/release-assets" \
            > release-build.json
          builder_status=$?
          cleanup_status=0
          if [[ "$PODMAN_SHORT_ROOT" =~ ^/tmp/dbb-root-[0-9]+-[0-9]+$ ]] && \
             [[ "$PODMAN_SHORT_RUNROOT" =~ ^/tmp/dbb-run-[0-9]+-[0-9]+$ ]]; then
            sudo rm -rf -- "$PODMAN_SHORT_ROOT" "$PODMAN_SHORT_RUNROOT"
            cleanup_status=$?
          else
            echo "refusing to clean unvalidated workflow-owned Podman storage paths" >&2
            cleanup_status=1
          fi
          set -e
          if [[ "$builder_status" -ne 0 ]]; then
            echo "canonical builder exit status: $builder_status" >&2
            if [[ "$cleanup_status" -ne 0 ]]; then
              echo "workflow-owned Podman storage cleanup also failed with status: $cleanup_status" >&2
            fi
            echo "Podman stderr (final 12000 bytes):" >&2
            if [[ -s "$podman_diag_log" ]]; then
              tail -c 12000 "$podman_diag_log" >&2
              echo >&2
            else
              echo "<empty>" >&2
            fi
            exit "$builder_status"
          fi
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo "canonical builder succeeded, but workflow-owned Podman storage cleanup failed with status: $cleanup_status" >&2
            exit "$cleanup_status"
          fi
          echo "workflow-owned Podman root and runroot cleanup: success"
          echo "Podman wrapper diagnostics:"
          tail -c 12000 "$podman_diag_log"
          echo
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          python3 - <<'PY'
          import json
          import os
          import re

          with open("release-build.json", encoding="utf-8") as handle:
              name = json.load(handle)["artifact"]["name"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9+.-]*_[0-9A-Za-z.+~_-]+_[a-z0-9]+\.deb", name):
              raise SystemExit("release helper returned an unsafe artifact name")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"deb_name={name}\n")
          PY

      - name: Preserve checked assets for Release creation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debbuilder-release-${{ steps.release_tag.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download checked assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: debbuilder-release-${{ needs.build.outputs.tag }}
          path: release-assets

      - name: Recheck downloaded assets
        shell: bash
        env:
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          test -f "release-assets/$DEB_NAME"
          test -f release-assets/SHA256SUMS
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )

      - name: Create draft, verify assets, and publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          DEB_NAME: ${{ needs.build.outputs.deb_name }}
        run: |
          gh release create "$TAG" \
            "release-assets/$DEB_NAME" \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DebBuilder $TAG" \
            --generate-notes \
            --draft
          printf '%s\n' "$DEB_NAME" SHA256SUMS | sort > expected-assets.txt
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > uploaded-assets.txt
          diff --unified expected-assets.txt uploaded-assets.txt
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
